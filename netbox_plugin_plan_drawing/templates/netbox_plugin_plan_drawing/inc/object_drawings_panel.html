{% load i18n %}
<div class="card">
  <h2 class="card-header">{% trans "Plan Drawings" %}</h2>
  <div class="list-group list-group-flush">
    {% for drawing, url in drawing_entries %}
      <a href="{{ url }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        <span><i class="mdi mdi-floor-plan"></i> {{ drawing.name }}</span>
        {% if drawing.description %}<small class="text-muted">{{ drawing.description }}</small>{% endif %}
      </a>
    {% endfor %}
  </div>
</div>
